# Dependabot: abre un pull request cuando hay actualizaciones.
# Cada PR pasa por el CI completo antes de que lo aceptes.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/plantilla"]   # también los workflows de la plantilla
    schedule:
      interval: weekly
    groups:
      github_actions:
        patterns: ["*"]
